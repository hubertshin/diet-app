<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1b7a5e">
<title>다이어트 코치</title>
<meta name="description" content="한 달 뒤 73kg — 오늘의 kcal 예산, 운동 체크리스트, 30일 예상 체중">
<link rel="manifest" href="./public/manifest.webmanifest">
<link rel="apple-touch-icon" href="./public/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f5; --panel: #ffffff; --panel-2: #eef1ee; --line: #dfe3de;
    --text: #141614; --muted: #5d635f; --faint: #8a918c;
    --accent: #1b7a5e; --accent-ink: #ffffff; --accent-soft: #dff1ea;
    --good: #0ca30c; --good-soft: #e3f6e3; --warn: #c57a00; --warn-soft: #fff1d6; --bad: #d03b3b; --bad-soft: #fde4e4;
    --cheat: #7a4bd6; --cheat-soft: #ece4fb;
    /* 차트 */
    --viz-surface: #fcfcfb; --viz-ink: #0b0b0b; --viz-ink-2: #52514e; --viz-muted: #898781; --viz-grid: #e1e0d9; --viz-axis: #c3c2b7;
    --viz-trend: #2a78d6; --viz-target: #eb6834; --viz-forecast: #1baf7a; --viz-sim: #4a3aa7; --viz-bar: #2a78d6; --viz-over: #d03b3b; --viz-full: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1210; --panel: #181c19; --panel-2: #222723; --line: #2d332e;
      --text: #eef1ee; --muted: #aab1ac; --faint: #7c837e;
      --accent: #3fbf96; --accent-ink: #0a1a14; --accent-soft: #163b30;
      --good: #4cd34c; --good-soft: #163a16; --warn: #f0b24a; --warn-soft: #3d2d0e; --bad: #f06b6b; --bad-soft: #3f1a1a;
      --cheat: #b79cf5; --cheat-soft: #2a1f44;
      --viz-surface: #1a1a19; --viz-ink: #ffffff; --viz-ink-2: #c3c2b7; --viz-muted: #898781; --viz-grid: #2c2c2a; --viz-axis: #383835;
      --viz-trend: #3987e5; --viz-target: #d95926; --viz-forecast: #199e70; --viz-sim: #9085e9; --viz-bar: #3987e5; --viz-over: #e66767; --viz-full: #4cd34c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow-x: hidden; touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    min-height: 44px; min-width: 44px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; border-color: transparent; }
  button.small { min-height: 36px; min-width: 36px; padding: 4px 10px; font-size: 14px; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="number"], input[type="text"], input[type="search"], input[type="time"], input[type="date"], select {
    width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  /* 레이아웃: 모바일 1컬럼 → PC(≥1024) 2컬럼 */
  #app { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 480px; margin: 0 auto; min-height: 100dvh; }
  #col-main { display: flex; flex-direction: column; min-height: 100dvh; }
  #col-side { display: none; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; min-height: 44px; }
  header.top h1 { font-size: 17px; margin: 0; }
  header.top .date { color: var(--muted); font-size: 14px; }
  main { flex: 1; min-width: 0; padding: 0 16px calc(72px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.active { display: block; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
  }
  nav.tabs button { border: 0; border-radius: 0; background: transparent; min-height: 56px; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); font-weight: 700; }
  @media (min-width: 1024px) {
    #app { max-width: 1100px; grid-template-columns: 480px minmax(0, 1fr); gap: 24px; padding: 0 24px; }
    #col-side { display: block; padding: 16px 0 24px; }
    #col-main { position: relative; }
    main { padding-bottom: 16px; }
    nav.tabs { position: sticky; bottom: 0; left: auto; right: auto; border: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 6px 0; min-width: 0; }
  .card.tight { padding: 10px 12px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .mid { font-size: 20px; font-weight: 700; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); font-size: 13px; }
  .small { font-size: 13px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .cheat { color: var(--cheat); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--panel-2); }
  .chip.pass { background: var(--good-soft); color: var(--good); }
  .chip.fail { background: var(--warn-soft); color: var(--warn); }
  .chip.fasting, .chip.reset { background: var(--bad-soft); color: var(--bad); }
  .chip.cheat { background: var(--cheat-soft); color: var(--cheat); }
  .chip.missing { background: var(--panel-2); color: var(--muted); }
  .stickers { letter-spacing: 0; font-size: 13px; white-space: nowrap; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .bar > i.over { background: var(--bad); }

  /* 체중 입력 */
  .weight-input input { font-size: 22px; font-weight: 700; text-align: center; }
  .weight-input button { white-space: nowrap; }

  /* 운동 체크리스트 */
  .wk { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; min-height: 38px; border-top: 1px solid var(--line); }
  .wk:first-of-type { border-top: 0; }
  .wk .name { font-size: 15px; }
  .wk .name.done { color: var(--good); }
  .wk input { width: 68px; min-height: 32px; padding: 4px 8px; text-align: right; }
  .wk .slot { display: flex; gap: 4px; }

  /* 식사 */
  .meal { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .meal:first-child { border-top: 0; }
  .meal .name { font-size: 15px; } .meal .sub { font-size: 12px; color: var(--muted); }
  .meal select { min-height: 36px; padding: 4px 8px; width: auto; }
  .result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 48px; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .result:first-child { border-top: 0; }
  .result .star { font-size: 18px; min-width: 40px; }
  .result .name { font-size: 15px; } .result .sub { font-size: 12px; color: var(--muted); }
  .result .kcal { font-weight: 700; }
  .portions { display: flex; gap: 6px; flex-wrap: wrap; }
  .portions button { min-height: 36px; padding: 4px 10px; }
  .portions button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .day-nav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }

  /* 달력 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--muted); }
  .cal .day { min-height: 54px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 4px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; }
  .cal .day.today { border-color: var(--accent); }
  .cal .day.sel { background: var(--accent-soft); }
  .cal .day.empty { visibility: hidden; }
  .cal .day .w { font-weight: 700; font-size: 12px; }
  .cal .day .ic { font-size: 13px; }

  /* 그래프 */
  .viz { width: 100%; height: auto; display: block; background: var(--viz-surface); border-radius: 10px; }
  .viz-grid { stroke: var(--viz-grid); stroke-width: 1; }
  .viz-axis { stroke: var(--viz-axis); stroke-width: 1; }
  .viz-tick { fill: var(--viz-muted); font-size: 10px; }
  .viz-label { fill: var(--viz-ink); font-size: 11px; font-weight: 700; } .viz-label.warn { fill: var(--viz-over); }
  .viz-icon { font-size: 10px; }
  .viz-today { stroke: var(--viz-axis); stroke-dasharray: 2 3; }
  .viz-target-line { stroke: var(--viz-muted); stroke-width: 1; stroke-dasharray: 1 3; }
  .viz-path-trend { fill: none; stroke: var(--viz-trend); stroke-width: 2; stroke-linejoin: round; }
  .viz-path-target { fill: none; stroke: var(--viz-target); stroke-width: 2; stroke-dasharray: 6 4; }
  .viz-path-forecast { fill: none; stroke: var(--viz-forecast); stroke-width: 2; stroke-dasharray: 2 4; }
  .viz-path-sim { fill: none; stroke: var(--viz-sim); stroke-width: 2; stroke-dasharray: 2 4; } .viz-path-sim.warn { stroke: var(--viz-over); }
  .viz-path-budget { fill: none; stroke: var(--viz-target); stroke-width: 2; }
  .viz-dot { fill: var(--viz-trend); stroke: var(--viz-surface); stroke-width: 2; }
  .viz-hit { fill: transparent; cursor: pointer; }
  .viz-bar { fill: var(--viz-bar); } .viz-bar.over { fill: var(--viz-over); } .viz-bar.full { fill: var(--viz-full); }
  .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
  .viz-key { display: inline-flex; align-items: center; gap: 5px; }
  .viz-swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--viz-trend); }
  .viz-swatch.dot { width: 9px; height: 9px; border-radius: 50%; }
  .viz-swatch.target { background: var(--viz-target); } .viz-swatch.forecast { background: var(--viz-forecast); } .viz-swatch.sim { background: var(--viz-sim); }
  .viz-swatch.bar { width: 9px; height: 9px; background: var(--viz-bar); } .viz-swatch.over { width: 9px; height: 9px; background: var(--viz-over); }
  .viz-swatch.full { width: 9px; height: 9px; background: var(--viz-full); } .viz-swatch.budget { background: var(--viz-target); } .viz-swatch.run { background: transparent; }
  .viz-empty { padding: 32px 12px; text-align: center; color: var(--muted); background: var(--viz-surface); border-radius: 10px; }
  .viz-note { font-size: 13px; color: var(--muted); margin: 4px 2px 0; }
  .viz-tip { background: var(--panel-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 6px; min-height: 20px; }
  .range { display: flex; gap: 6px; }
  .range button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  @media (min-width: 1024px) { #view-graph .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } #view-graph .charts .card { margin: 0; } }

  /* 시트·대화상자·토스트 */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 20; align-items: flex-end; justify-content: center; }
  .sheet-backdrop.open { display: flex; }
  .sheet { background: var(--panel); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 90dvh; overflow: auto; }
  .sheet h3 { margin: 0 0 10px; font-size: 17px; }
  input[type="range"] { width: 100%; min-height: 44px; }
  .toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: none; z-index: 30; gap: 12px; align-items: center; max-width: 92vw; font-size: 14px; }
  .toast.show { display: flex; }
  .toast button { min-height: 32px; padding: 2px 10px; background: transparent; color: inherit; border-color: currentColor; font-size: 14px; }
  .notice { border-left: 4px solid var(--accent); }
  .notice.bad { border-left-color: var(--bad); }
  .field { margin: 8px 0; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field .row input { width: auto; flex: 1; }
  .ob-step { display: none; } .ob-step.active { display: block; }
  .sticker-anim { animation: pop .5s ease-out; display: inline-block; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sticker-anim { animation: none; } }
  table.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.stats td { padding: 4px 0; border-top: 1px solid var(--line); } table.stats td:last-child { text-align: right; font-weight: 700; }
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <div id="col-main">
    <header class="top">
      <h1>다이어트 코치</h1>
      <span class="date" id="top-date"></span>
    </header>
    <main>
      <section id="view-home" class="view active" aria-label="홈"></section>
      <section id="view-log" class="view" aria-label="기록"></section>
      <section id="view-graph" class="view" aria-label="그래프"></section>
      <section id="view-cal" class="view" aria-label="달력"></section>
      <section id="view-settings" class="view" aria-label="설정"></section>
    </main>
    <nav class="tabs" aria-label="탭">
      <button data-tab="home" class="active"><span class="ic">🏠</span>홈</button>
      <button data-tab="log"><span class="ic">🍚</span>기록</button>
      <button data-tab="graph"><span class="ic">📈</span>그래프</button>
      <button data-tab="cal"><span class="ic">📅</span>달력</button>
      <button data-tab="settings"><span class="ic">⚙️</span>설정</button>
    </nav>
  </div>
  <aside id="col-side" aria-label="그래프(PC)"></aside>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
